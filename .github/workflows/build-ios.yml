name: CyberKiwi iOS Build & TestFlight Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: Sign and upload this build to TestFlight
        type: boolean
        default: false

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run lint
      - run: npm test

  build-ios:
    name: Build iOS
    needs: lint-and-test
    runs-on: macos-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run db:generate

      - name: Check iOS SDK
        run: |
          xcodebuild -version
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          if [ "${sdk_version%%.*}" -lt 26 ]; then
            echo "::error::The selected Xcode must include an iOS 26 or newer SDK."
            exit 1
          fi

      - name: Build web assets and sync Capacitor
        env:
          VITE_CYBERKIWI_API_BASE_URL: ${{ vars.VITE_CYBERKIWI_API_BASE_URL }}
        run: |
          if [ "${{ inputs.upload_testflight == true }}" = "true" ]; then
            npm run release:check-api
          fi
          npm run build
          npx cap sync ios

      - name: Verify unsigned device build
        if: github.event_name != 'workflow_dispatch' || !inputs.upload_testflight
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App -configuration Release -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO build

      - name: Archive and upload to TestFlight
        if: github.event_name == 'workflow_dispatch' && inputs.upload_testflight
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER: ${{ secrets.APP_STORE_CONNECT_API_ISSUER }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          for setting in APPLE_TEAM_ID APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_API_ISSUER APP_STORE_CONNECT_API_KEY; do
            if [ -z "${!setting}" ]; then
              echo "::error::Configure $setting in GitHub Actions before uploading."
              exit 1
            fi
          done

          umask 077
          work_dir="$(mktemp -d "$RUNNER_TEMP/cyberkiwi-ios.XXXXXX")"
          trap 'rm -rf "$work_dir"' EXIT
          key_path="$work_dir/AuthKey.p8"
          printf '%s\n' "$APP_STORE_CONNECT_API_KEY" > "$key_path"
          xcode_auth=(
            -allowProvisioningUpdates
            -authenticationKeyPath "$key_path"
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID"
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_API_ISSUER"
          )

          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$work_dir/App.xcarchive" "${xcode_auth[@]}" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT" archive

          export_options="$work_dir/ExportOptions.plist"
          plutil -create xml1 "$export_options"
          plutil -insert method -string app-store-connect "$export_options"
          plutil -insert destination -string upload "$export_options"
          plutil -insert teamID -string "$APPLE_TEAM_ID" "$export_options"
          plutil -insert testFlightInternalTestingOnly -bool YES "$export_options"
          xcodebuild -exportArchive -archivePath "$work_dir/App.xcarchive" \
            -exportOptionsPlist "$export_options" -exportPath "$work_dir/export" \
            "${xcode_auth[@]}"
